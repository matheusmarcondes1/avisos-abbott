<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Andon — Chamados de Produção</title>
<link rel="icon" type="image/jpeg" href="https://cdn.brandfetch.io/idtqCIB40M/w/200/h/200/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&amp;t=1756696667154">
<style>
/* ============================================================
   Paleta Abbott — visual suave e agradável
   ============================================================ */
:root{
  --ink:#33404a; --ink-soft:#68767f; --paper:#f7f9fb; --card:#ffffff;
  --line:#e5ecf0; --line-soft:#eef3f6;
  --accent:#000075; --accent-bright:#2e4aed; --accent-soft:#eef1fe; --accent-ink:#fff;

  /* Cores por tipo de chamado (tons suaves + sólido para os quadrados) */
  --mat:#e6a900;  --mat-soft:#fff7e0;  --mat-ink:#5a4500;   /* Falta de material — amarelo */
  --qua:#7259bd;  --qua-soft:#efeafb;  --qua-ink:#372a63;   /* Qualidade — roxo */
  --ins:#e8722a;  --ins-soft:#fdefe3;  --ins-ink:#65330f;   /* Inspeção — laranja */
  --ass:#3a9d6b;  --ass-soft:#e7f5ee;  --ass-ink:#1c5738;   /* Assistente — verde */
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{ font-family:inherit; cursor:pointer; color:inherit; }
input,select{ font-family:inherit; }

/* logo */
.logo{ color:var(--accent); height:30px; line-height:0; display:inline-block; }
.logo img{ height:100%; width:auto; display:none; }
.logo.img-ok img{ display:block; }
.logo.img-ok .lg-fallback{ display:none; }
.logo .lg-fallback{ display:block; height:100%; }
.logo .lg-fallback svg{ height:100%; width:auto; display:block; }

/* telas */
.screen{ display:none; min-height:100dvh; flex-direction:column; }
.screen.active{ display:flex; }

/* cabeçalho: logo à direita; botão voltar à esquerda — sem se sobrepor */
.topbar{
  display:flex; align-items:center; gap:16px;
  padding:14px clamp(16px,3vw,32px); border-bottom:1px solid var(--line);
  background:var(--card); flex:none;
}
.topbar .grow{ flex:1; min-width:0; }
.topbar .logo{ flex:none; }
.back{
  flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:10px 18px; font-size:16px; font-weight:700;
}
.back:hover{ border-color:var(--accent-bright); color:var(--accent-bright); }
.title{ font-size:clamp(18px,2.4vw,24px); font-weight:700; letter-spacing:-.01em; }
.subtitle{ font-size:14px; color:var(--ink-soft); margin-top:2px; }

.muted{ color:var(--ink-soft); }
.hidden{ display:none !important; }

/* ============================================================
   TELA DE SELEÇÃO — três colunas (Perfil / Etapa / Mesa)
   ============================================================ */
.select-wrap{ flex:1; display:flex; align-items:flex-start; justify-content:center;
  padding:clamp(20px,4vh,48px) clamp(16px,3vw,40px); }
.cols{ display:flex; gap:clamp(24px,4vw,64px); align-items:flex-start; width:100%;
  max-width:1100px; }
.col{ flex:1; min-width:0; opacity:1; transition:opacity .25s ease; }
.col.reveal{ animation:fadein .28s ease; }
@keyframes fadein{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
.col-h{ font-size:15px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:16px; padding-left:4px; }
.col-body{ display:flex; flex-direction:column; gap:14px; }

.opt{
  width:100%; text-align:center; background:var(--card); border:2px solid var(--line);
  border-radius:16px; padding:20px 18px; font-size:19px; font-weight:700; color:var(--ink);
  transition:border-color .12s, background .12s, transform .08s;
}
.opt:hover{ border-color:var(--accent-bright); }
.opt:active{ transform:scale(.99); }
.opt.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

/* grade de mesas 5 por linha */
.mesa-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; }
.mesa{
  aspect-ratio:5/4; display:flex; align-items:center; justify-content:center;
  background:var(--card); border:2px solid var(--line); border-radius:12px;
  font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink);
}
.mesa:hover{ border-color:var(--accent-bright); }
.mesa:active{ transform:scale(.97); }

/* ============================================================
   OPERADORA — tela de chamado (tablet Windows na horizontal)
   ============================================================ */
.op-body{ flex:1; padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,32px); display:flex; }
.call-grid{
  flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  gap:clamp(14px,2vw,22px); min-height:0;
}
@media (max-width:720px){ .call-grid{ grid-template-columns:1fr; grid-template-rows:none; } }
.call-btn{
  border:2px solid var(--line); border-radius:22px; padding:clamp(16px,3vh,32px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  text-align:center; background:var(--card); transition:transform .08s, box-shadow .12s;
}
.call-btn:active{ transform:scale(.99); }
.call-btn .cb-name{ font-size:clamp(24px,3.4vw,40px); font-weight:700; letter-spacing:-.01em; }
.call-btn .cb-target{ font-size:clamp(13px,1.5vw,17px); font-weight:700; opacity:.8;
  text-transform:uppercase; letter-spacing:.08em; }
.call-btn .cb-state{ font-size:clamp(14px,1.7vw,20px); font-weight:700; margin-top:2px; }
.call-btn .cb-dot{ width:16px; height:16px; border-radius:50%; }
/* cores por tipo (fechado = suave; aberto = sólido) */
.call-btn[data-t="falta_material"]{ border-color:var(--mat); }
.call-btn[data-t="qualidade"]{ border-color:var(--qua); }
.call-btn[data-t="inspecao"]{ border-color:var(--ins); }
.call-btn[data-t="assistente"]{ border-color:var(--ass); }
.call-btn[data-t="falta_material"] .cb-target{ color:var(--mat-ink); }
.call-btn[data-t="qualidade"] .cb-target{ color:var(--qua-ink); }
.call-btn[data-t="inspecao"] .cb-target{ color:var(--ins-ink); }
.call-btn[data-t="assistente"] .cb-target{ color:var(--ass-ink); }
.call-btn.open[data-t="falta_material"]{ background:var(--mat-soft); border-color:var(--mat); }
.call-btn.open[data-t="qualidade"]{ background:var(--qua-soft); border-color:var(--qua); }
.call-btn.open[data-t="inspecao"]{ background:var(--ins-soft); border-color:var(--ins); }
.call-btn.open[data-t="assistente"]{ background:var(--ass-soft); border-color:var(--ass); }
.call-btn.open{ box-shadow:0 0 0 3px rgba(0,0,0,.03) inset; }
.mesa-badge{ font-size:clamp(18px,2.2vw,26px); font-weight:700; }
.mesa-badge b{ color:var(--accent); }

/* ============================================================
   PAINEL DOS PERFIS RECEPTORES — fila de quadrados
   ============================================================ */
.board-body{ flex:1; padding:clamp(14px,2.4vh,24px) clamp(16px,3vw,32px); overflow:auto; }
.board-info{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:16px; flex-wrap:wrap; }
.count-pill{ font-size:15px; font-weight:700; color:var(--ink-soft); }
.queue{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
.qsq{
  position:relative; border-radius:18px; padding:16px 14px 14px; color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  min-height:120px; animation:pop .2s ease;
}
@keyframes pop{ from{ transform:scale(.94); opacity:.4;} to{ transform:none; opacity:1;} }
.qsq.t-falta_material{ background:var(--mat); }
.qsq.t-qualidade{ background:var(--qua); }
.qsq.t-inspecao{ background:var(--ins); }
.qsq.t-assistente{ background:var(--ass); }
.qsq .q-mesa{ font-size:clamp(38px,6vw,58px); font-weight:800; line-height:1;
  font-variant-numeric:tabular-nums; }
.qsq .q-etapa{ font-size:13px; font-weight:700; opacity:.92; }
.qsq .q-age{ font-size:12px; font-weight:700; opacity:.85; font-variant-numeric:tabular-nums; }
.qsq .q-done{
  position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%;
  border:none; background:rgba(255,255,255,.9); color:#1a1a1a; font-size:18px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.board-empty{ border:2px dashed var(--line); border-radius:18px; padding:48px 20px;
  text-align:center; color:var(--ink-soft); font-size:17px; }

/* faixa de notificação (novo chamado) */
.notice{ position:fixed; left:50%; top:14px; transform:translate(-50%,-160%);
  z-index:50; min-width:min(80vw,560px); max-width:92vw; border-radius:16px;
  padding:16px 22px; text-align:center; color:#fff; box-shadow:0 12px 40px rgba(0,0,0,.25);
  opacity:0; transition:transform .3s ease, opacity .3s ease; pointer-events:none; }
.notice.show{ transform:translate(-50%,0); opacity:1; }
.notice.t-falta_material{ background:var(--mat); } .notice.t-qualidade{ background:var(--qua); }
.notice.t-inspecao{ background:var(--ins); } .notice.t-assistente{ background:var(--ass); }
.notice .n-t{ font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.9; }
.notice .n-m{ font-size:30px; font-weight:800; }

/* abas do Assistente */
.tabs{ display:flex; gap:8px; }
.tab{ border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:9px 16px; font-size:14px; font-weight:700; color:var(--ink-soft); }
.tab.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

/* estatísticas */
.stats-body{ flex:1; padding:clamp(16px,3vh,28px) clamp(16px,3vw,32px); overflow:auto; }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:18px; }
.stat-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
.stat-num{ font-size:34px; font-weight:800; letter-spacing:-.01em; }
.stat-lbl{ font-size:13px; color:var(--ink-soft); font-weight:700; margin-top:4px;
  text-transform:uppercase; letter-spacing:.06em; }
.bars{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:18px; }
.bars h3{ font-size:15px; margin-bottom:12px; }
.bar-row{ display:flex; align-items:center; gap:12px; margin:8px 0; font-size:14px; font-weight:700; }
.bar-row .bl{ width:150px; flex:none; color:var(--ink-soft); }
.bar-track{ flex:1; height:16px; background:var(--line-soft); border-radius:999px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; background:var(--accent-bright); }
.bar-row .bv{ width:56px; text-align:right; font-variant-numeric:tabular-nums; }

/* config de mesas */
.config-body{ flex:1; padding:clamp(16px,3vh,28px) clamp(16px,3vw,32px); overflow:auto; }
.etapa-block{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:16px; }
.etapa-block .eb-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:14px; }
.etapa-block .eb-name{ font-size:18px; font-weight:700; }
.chips{ display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px; }
.chip{ border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 0;
  text-align:center; font-weight:700; font-variant-numeric:tabular-nums; font-size:16px; color:var(--ink-soft); }
.chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

.btn{ border:none; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:700;
  background:var(--accent); color:#fff; }
.btn:hover{ filter:brightness(1.08); }
.btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
.btn.small{ padding:8px 14px; font-size:14px; }

.foot{ padding:14px clamp(16px,3vw,32px); border-top:1px solid var(--line); }
.disclaimer{ font-size:12px; color:var(--ink-soft); line-height:1.6; }
.disclaimer b{ color:var(--ink); }

/* setup */
.setup-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px;
  max-width:440px; margin:0 auto; width:100%; padding:24px; }
.setup-wrap input{ padding:14px; border:1px solid var(--line); border-radius:12px; font-size:15px; }
.setup-wrap label{ font-size:13px; font-weight:700; color:var(--ink-soft); }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<!-- ============ SETUP (sem configuração) ============ -->
<section id="scr-setup" class="screen">
  <div class="topbar"><div class="grow"><div class="title">Conectar ao Supabase</div></div><div class="logo"></div></div>
  <div class="setup-wrap">
    <div class="muted">Informe a URL do projeto e a chave publishable/anon. Ficam salvas neste dispositivo.</div>
    <label>URL do projeto</label>
    <input id="setup-url" placeholder="https://xxxx.supabase.co">
    <label>Chave publishable / anon</label>
    <input id="setup-key" placeholder="sb_publishable_… ou anon key">
    <div id="setup-msg" class="muted"></div>
    <button class="btn" onclick="saveSetup()">Salvar e continuar</button>
  </div>
</section>

<!-- ============ SELEÇÃO (3 colunas) ============ -->
<section id="scr-select" class="screen">
  <div class="topbar"><div class="grow"></div><div class="logo"></div></div>
  <div class="select-wrap">
    <div class="cols">
      <div class="col" id="col-perfil">
        <div class="col-h">Perfil</div>
        <div class="col-body" id="perfil-body"></div>
      </div>
      <div class="col hidden" id="col-etapa">
        <div class="col-h">Etapa</div>
        <div class="col-body" id="etapa-body"></div>
      </div>
      <div class="col hidden" id="col-mesa">
        <div class="col-h">Mesa</div>
        <div class="col-body mesa-grid" id="mesa-body"></div>
      </div>
    </div>
  </div>
  <div class="foot"><div class="disclaimer" id="disc-1"></div></div>
</section>

<!-- ============ OPERADORA — chamado ============ -->
<section id="scr-op" class="screen">
  <div class="topbar">
    <button class="back" onclick="goSelect()">← Trocar mesa</button>
    <div class="grow"><span class="mesa-badge" id="op-id"></span></div>
    <div class="logo"></div>
  </div>
  <div class="op-body">
    <div class="call-grid" id="call-grid"></div>
  </div>
</section>

<!-- ============ PERFIL RECEPTOR — fila ============ -->
<section id="scr-board" class="screen">
  <div class="topbar">
    <button class="back" onclick="goSelect()">← Voltar</button>
    <div class="grow">
      <div class="title" id="board-title">Painel</div>
      <div class="tabs hidden" id="board-tabs" style="margin-top:8px"></div>
    </div>
    <div class="logo"></div>
  </div>
  <div class="board-body">
    <div class="board-info">
      <span class="count-pill" id="board-count">—</span>
    </div>
    <div class="queue" id="queue"></div>
  </div>
</section>

<!-- ============ ASSISTENTE — estatísticas ============ -->
<section id="scr-stats" class="screen">
  <div class="topbar">
    <button class="back" onclick="enterBoard('assistente')">← Chamados</button>
    <div class="grow"><div class="title">Estatísticas</div></div>
    <div class="logo"></div>
  </div>
  <div class="stats-body">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn ghost small" onclick="loadStats()">Atualizar</button>
      <button class="btn small" onclick="exportCSV()">Exportar (Excel/CSV)</button>
    </div>
    <div class="stat-row" id="stat-cards"></div>
    <div class="bars" id="stat-tipo"></div>
    <div class="bars" id="stat-etapa"></div>
    <div class="bars" id="stat-mesa"></div>
  </div>
</section>

<!-- ============ ASSISTENTE — configurar mesas ============ -->
<section id="scr-config" class="screen">
  <div class="topbar">
    <button class="back" onclick="enterBoard('assistente')">← Chamados</button>
    <div class="grow"><div class="title">Mesas por etapa</div>
      <div class="subtitle">Selecione as mesas disponíveis em cada etapa. Sem seleção = todas (1–25).</div></div>
    <div class="logo"></div>
  </div>
  <div class="config-body" id="config-body"></div>
</section>

<div id="notice" class="notice"><div class="n-t" id="n-t"></div><div class="n-m" id="n-m"></div></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ---------------- logo ---------------- */
const LOGO_BLUE='https://cdn.brandfetch.io/idtqCIB40M/theme/dark/logo.svg?c=1bxid64Mup7aczewSAYMX&t=1756696705337';
const LOGO_HTML='<img src="'+LOGO_BLUE+'" alt="Abbott" onload="this.closest(\'.logo\').classList.add(\'img-ok\')">'
  +'<span class="lg-fallback"><svg viewBox="0 0 236 60" role="img" aria-label="Abbott"><text x="0" y="47"'
  +' fill="currentColor" font-family="\'Helvetica Neue\',Helvetica,Arial,sans-serif" font-weight="700"'
  +' font-size="56" letter-spacing="-3">Abbott</text></svg></span>';
document.querySelectorAll('.logo').forEach(el=> el.innerHTML=LOGO_HTML);
document.getElementById('disc-1').innerHTML =
  'Plataforma <b>genérica de andon para produção</b> — projeto pessoal, de <b>código aberto</b>, '
  +'criado por iniciativa própria. Registra apenas sinais operacionais de chamado. '
  +'Desenvolvido por <b>Matheus Marcondes</b>.';

/* ---------------- config / cliente ---------------- */
const LS='andon-config-v1';
function loadCfg(){ let c=window.ANDON_CONFIG||{}; try{const s=JSON.parse(localStorage.getItem(LS)||'null'); if(s)c={...c,...s};}catch(e){} return c; }
let CFG=loadCfg(); let sb=null;

const ETAPAS=['Anel Revestido','Sizing & Trimming','SVE','SVS','Revisão Final'];
const PERFIS=[
  {id:'operadora', label:'Operadora'},
  {id:'falta_material', label:'Material Handler'},
  {id:'qualidade', label:'Coordenação Técnica'},
  {id:'inspecao', label:'Inspeção'},
  {id:'assistente', label:'Assistente'},
];
const TYPES={
  falta_material:{label:'Falta de Material', target:'Material Handler'},
  qualidade:{label:'Qualidade', target:'Coordenação Técnica'},
  inspecao:{label:'Inspeção', target:'Inspeção'},
  assistente:{label:'Assistente', target:'Assistentes'},
};
const CALL_ORDER=['falta_material','qualidade','inspecao','assistente'];

let ETAPA_MESAS={};      // etapa -> [mesas] (vazio/ausente = todas)
let view=null;           // 'select'|'op'|'board'|'stats'|'config'
let OP={etapa:null, mesa:null};
let boardType=null;
let openCache=[];        // chamados abertos (cache p/ render)

/* ---------------- util ---------------- */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function ageStr(iso){ const s=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/1000));
  const m=Math.floor(s/60); return m>0? m+' min' : s+' s'; }

/* ---------------- setup ---------------- */
window.saveSetup=()=>{
  const url=document.getElementById('setup-url').value.trim();
  const key=document.getElementById('setup-key').value.trim();
  if(!/^https:\/\/.+\.supabase\.co/.test(url)||!key){ document.getElementById('setup-msg').textContent='URL/chave inválidas.'; return; }
  localStorage.setItem(LS, JSON.stringify({SUPABASE_URL:url, SUPABASE_KEY:key}));
  CFG=loadCfg(); initClient(); startRealtime(); goSelect();
};
function initClient(){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_KEY) return false;
  sb=createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth:{persistSession:false} });
  return true;
}

/* ---------------- dados ---------------- */
async function loadEtapaMesas(){
  ETAPA_MESAS={};
  const { data } = await sb.from('etapa_config').select('etapa,mesas');
  (data||[]).forEach(r=>{ ETAPA_MESAS[r.etapa]=r.mesas||[]; });
}
function mesasFor(etapa){
  const m=ETAPA_MESAS[etapa];
  if(m && m.length) return [...m].sort((a,b)=>a-b);
  return Array.from({length:25},(_,i)=>i+1);
}
async function fetchOpen(){
  const { data } = await sb.from('andon_events').select('*').eq('status','aberto').order('created_at');
  openCache = data||[]; return openCache;
}

/* ---------------- SELEÇÃO ---------------- */
window.goSelect=async ()=>{
  view='select'; OP={etapa:null,mesa:null}; boardType=null;
  document.getElementById('col-etapa').classList.add('hidden');
  document.getElementById('col-mesa').classList.add('hidden');
  document.getElementById('perfil-body').innerHTML = PERFIS.map(p=>
    `<button class="opt" data-p="${p.id}">${esc(p.label)}</button>`).join('');
  document.querySelectorAll('#perfil-body .opt').forEach(b=> b.onclick=()=>pickPerfil(b.dataset.p, b));
  await loadEtapaMesas();
  show('scr-select');
};
function pickPerfil(id, btn){
  document.querySelectorAll('#perfil-body .opt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('col-mesa').classList.add('hidden');
  if(id==='operadora'){
    const eb=document.getElementById('etapa-body');
    eb.innerHTML = ETAPAS.map(e=>`<button class="opt" data-e="${esc(e)}">${esc(e)}</button>`).join('');
    eb.querySelectorAll('.opt').forEach(b=> b.onclick=()=>pickEtapa(b.dataset.e, b));
    revealCol('col-etapa');
  } else {
    document.getElementById('col-etapa').classList.add('hidden');
    enterBoard(id);
  }
}
function pickEtapa(etapa, btn){
  document.querySelectorAll('#etapa-body .opt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  OP.etapa=etapa;
  const mb=document.getElementById('mesa-body');
  mb.innerHTML = mesasFor(etapa).map(n=>`<button class="mesa" data-m="${n}">${pad2(n)}</button>`).join('');
  mb.querySelectorAll('.mesa').forEach(b=> b.onclick=()=>{ OP.mesa=+b.dataset.m; enterOperador(); });
  revealCol('col-mesa');
}
function revealCol(id){ const c=document.getElementById(id); c.classList.remove('hidden');
  c.classList.remove('reveal'); void c.offsetWidth; c.classList.add('reveal'); }

/* ---------------- OPERADORA ---------------- */
function enterOperador(){
  view='op';
  document.getElementById('op-id').innerHTML = 'Mesa <b>'+pad2(OP.mesa)+'</b> · '+esc(OP.etapa);
  const g=document.getElementById('call-grid');
  g.innerHTML = CALL_ORDER.map(t=>`
    <button class="call-btn" data-t="${t}" onclick="toggleCall('${t}')">
      <div class="cb-target">Aciona ${esc(TYPES[t].target)}</div>
      <div class="cb-name">${esc(TYPES[t].label)}</div>
      <div class="cb-state" data-state="${t}">Toque para chamar</div>
    </button>`).join('');
  show('scr-op');
  refreshOp();
}
function myOpen(type){ return openCache.find(e=> e.mesa===OP.mesa && e.type===type && e.status==='aberto'); }
window.toggleCall=async (type)=>{
  const ev=myOpen(type);
  if(ev){ await sb.from('andon_events').update({status:'cancelado', resolved_at:new Date().toISOString()}).eq('id', ev.id); }
  else { await sb.from('andon_events').insert({type, mesa:OP.mesa, etapa:OP.etapa, status:'aberto'}); beep(); }
  await fetchOpen(); refreshOp();
};
function refreshOp(){
  if(view!=='op') return;
  CALL_ORDER.forEach(t=>{
    const btn=document.querySelector('.call-btn[data-t="'+t+'"]');
    const st=document.querySelector('[data-state="'+t+'"]');
    if(!btn) return;
    const ev=myOpen(t);
    if(ev){ btn.classList.add('open'); st.innerHTML='● Chamado aberto há <span data-since="'+ev.created_at+'">'+ageStr(ev.created_at)+'</span> — toque para cancelar'; }
    else{ btn.classList.remove('open'); st.textContent='Toque para chamar'; }
  });
}

/* ---------------- PERFIS RECEPTORES (fila) ---------------- */
window.enterBoard=(type)=>{
  view='board'; boardType=type;
  document.getElementById('board-title').textContent =
    type==='falta_material'?'Material Handler': type==='qualidade'?'Coordenação Técnica':
    type==='inspecao'?'Inspeção':'Assistentes';
  const tabs=document.getElementById('board-tabs');
  if(type==='assistente'){
    tabs.classList.remove('hidden');
    tabs.innerHTML = '<button class="tab on">Chamados</button>'
      +'<button class="tab" onclick="enterStats()">Estatísticas</button>'
      +'<button class="tab" onclick="enterConfig()">Mesas</button>';
  } else tabs.classList.add('hidden');
  show('scr-board');
  refreshBoard();
};
function refreshBoard(){
  if(view!=='board') return;
  const list=openCache.filter(e=> e.type===boardType && e.status==='aberto');
  document.getElementById('board-count').textContent =
    list.length + (list.length===1?' chamado em aberto':' chamados em aberto');
  const q=document.getElementById('queue');
  if(!list.length){ q.innerHTML='<div class="board-empty">Nenhum chamado em aberto. 👍</div>'; return; }
  q.innerHTML = list.map(e=>`
    <div class="qsq t-${e.type}">
      <button class="q-done" onclick="resolveCall('${e.id}')" aria-label="Concluir">✓</button>
      <div class="q-mesa">${pad2(e.mesa)}</div>
      <div class="q-etapa">${esc(e.etapa||'')}</div>
      <div class="q-age" data-since="${e.created_at}">${ageStr(e.created_at)}</div>
    </div>`).join('');
}
window.resolveCall=async (id)=>{
  await sb.from('andon_events').update({status:'resolvido', resolved_at:new Date().toISOString()}).eq('id', id);
  await fetchOpen(); refreshBoard();
};

/* ---------------- ESTATÍSTICAS (assistente) ---------------- */
let statsCache=[];
window.enterStats=()=>{ view='stats'; show('scr-stats'); loadStats(); };
window.loadStats=async ()=>{
  const { data } = await sb.from('andon_events').select('*').order('created_at',{ascending:false}).limit(5000);
  statsCache=data||[];
  const total=statsCache.length;
  const abertos=statsCache.filter(e=>e.status==='aberto').length;
  const resolvidos=statsCache.filter(e=>e.status==='resolvido');
  const cancelados=statsCache.filter(e=>e.status==='cancelado').length;
  const tempos=resolvidos.map(e=>(new Date(e.resolved_at)-new Date(e.created_at))/60000).filter(x=>x>=0);
  const media=tempos.length? (tempos.reduce((a,b)=>a+b,0)/tempos.length):0;
  document.getElementById('stat-cards').innerHTML=[
    ['Total', total], ['Em aberto', abertos], ['Resolvidos', resolvidos.length],
    ['Cancelados', cancelados], ['Tempo médio', media?media.toFixed(1)+' min':'—']
  ].map(([l,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-lbl">${l}</div></div>`).join('');
  bars('stat-tipo','Por tipo', tally(statsCache,e=>TYPES[e.type]?.label||e.type));
  bars('stat-etapa','Por etapa', tally(statsCache.filter(e=>e.etapa),e=>e.etapa));
  bars('stat-mesa','Por mesa', tally(statsCache.filter(e=>e.mesa),e=>'Mesa '+pad2(e.mesa)));
};
function tally(arr, keyfn){ const m={}; arr.forEach(e=>{ const k=keyfn(e); m[k]=(m[k]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function bars(id, title, entries){
  const max=Math.max(1,...entries.map(e=>e[1]));
  document.getElementById(id).innerHTML='<h3>'+title+'</h3>'+ (entries.length?entries.map(([k,v])=>`
    <div class="bar-row"><div class="bl">${esc(k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/max*100)}%"></div></div>
      <div class="bv">${v}</div></div>`).join(''):'<div class="muted">Sem dados.</div>');
}
window.exportCSV=()=>{
  const rows=[['Abertura','Tipo','Etapa','Mesa','Status','Resolucao','Minutos']];
  statsCache.forEach(e=>{
    const mins = e.resolved_at? ((new Date(e.resolved_at)-new Date(e.created_at))/60000).toFixed(1):'';
    rows.push([ new Date(e.created_at).toLocaleString('pt-BR'), TYPES[e.type]?.label||e.type,
      e.etapa||'', e.mesa??'', e.status, e.resolved_at? new Date(e.resolved_at).toLocaleString('pt-BR'):'', mins ]);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>{ c=String(c); return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='andon_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

/* ---------------- CONFIG DE MESAS (assistente) ---------------- */
let cfgSel={};   // etapa -> Set(mesas)
window.enterConfig=async ()=>{
  view='config'; await loadEtapaMesas();
  cfgSel={};
  ETAPAS.forEach(e=>{ cfgSel[e]=new Set((ETAPA_MESAS[e]&&ETAPA_MESAS[e].length)?ETAPA_MESAS[e]:[]); });
  const body=document.getElementById('config-body');
  body.innerHTML = ETAPAS.map(e=>`
    <div class="etapa-block">
      <div class="eb-head"><div class="eb-name">${esc(e)}</div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" data-all="${esc(e)}">Todas</button>
          <button class="btn ghost small" data-none="${esc(e)}">Nenhuma</button>
        </div></div>
      <div class="chips" data-etapa="${esc(e)}">
        ${Array.from({length:25},(_,i)=>i+1).map(n=>`<button class="chip" data-n="${n}">${pad2(n)}</button>`).join('')}
      </div>
    </div>`).join('');
  body.querySelectorAll('.chips').forEach(cont=>{
    const e=cont.dataset.etapa;
    cont.querySelectorAll('.chip').forEach(ch=>{
      const n=+ch.dataset.n;
      if(cfgSel[e].has(n)) ch.classList.add('on');
      ch.onclick=()=>{ if(cfgSel[e].has(n)){cfgSel[e].delete(n); ch.classList.remove('on');}
        else{cfgSel[e].add(n); ch.classList.add('on');} saveEtapa(e); };
    });
  });
  body.querySelectorAll('[data-all]').forEach(b=> b.onclick=()=>{ const e=b.dataset.all;
    cfgSel[e]=new Set(Array.from({length:25},(_,i)=>i+1));
    document.querySelector('.chips[data-etapa="'+cssEsc(e)+'"]').querySelectorAll('.chip').forEach(c=>c.classList.add('on')); saveEtapa(e); });
  body.querySelectorAll('[data-none]').forEach(b=> b.onclick=()=>{ const e=b.dataset.none;
    cfgSel[e]=new Set();
    document.querySelector('.chips[data-etapa="'+cssEsc(e)+'"]').querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); saveEtapa(e); });
  show('scr-config');
};
function cssEsc(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/["\\]/g,'\\$&'); }
let saveTimer=null;
function saveEtapa(etapa){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    const mesas=[...cfgSel[etapa]].sort((a,b)=>a-b);
    await sb.from('etapa_config').upsert({etapa, mesas, updated_at:new Date().toISOString()});
    await loadEtapaMesas();
  }, 400);
}

/* ---------------- REALTIME + NOTIFICAÇÃO ---------------- */
let realtimeCh=null;
function startRealtime(){
  if(!sb) return;
  if(realtimeCh) sb.removeChannel(realtimeCh);
  realtimeCh = sb.channel('andon-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'andon_events'}, async (p)=>{
      if(p.eventType==='INSERT' && p.new && p.new.status==='aberto'
         && (view==='board') && p.new.type===boardType){
        notify(p.new);
      }
      await fetchOpen();
      if(view==='op') refreshOp();
      else if(view==='board') refreshBoard();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'etapa_config'}, ()=> loadEtapaMesas())
    .subscribe();
}
function notify(ev){
  const el=document.getElementById('notice');
  el.className='notice show t-'+ev.type;
  document.getElementById('n-t').textContent = TYPES[ev.type]?.label || 'Chamado';
  document.getElementById('n-m').textContent = 'Mesa '+pad2(ev.mesa)+(ev.etapa?' · '+ev.etapa:'');
  alarm();
  clearTimeout(el._t); el._t=setTimeout(()=> el.classList.remove('show'), 8000);
}

/* ---------------- SOM (alto) ---------------- */
function tone(peak, dur, freqs, type){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=12;
    const master=ctx.createGain(); master.gain.value=0.95; comp.connect(master); master.connect(ctx.destination);
    freqs.forEach(([f,t0])=>{ const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(peak, ctx.currentTime+t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t0+dur);
      o.connect(g); g.connect(comp); o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur+0.05); });
    setTimeout(()=>ctx.close().catch(()=>{}), (dur+0.6)*1000+400);
  }catch(e){}
}
function beep(){ tone(0.9, 0.5, [[880,0],[1174.7,0.28]], 'sine'); }
function alarm(){ tone(1.0, 0.4, [[659.3,0],[880,0.22],[1174.7,0.44]], 'triangle'); }

/* atualiza os "há X min" a cada segundo (barato) */
setInterval(()=>{ document.querySelectorAll('[data-since]').forEach(el=>{ el.textContent=ageStr(el.dataset.since); }); }, 1000);

/* ---------------- init ---------------- */
async function init(){
  if(!initClient()){ show('scr-setup'); return; }
  startRealtime();
  await fetchOpen();
  goSelect();
}
init();
</script>
